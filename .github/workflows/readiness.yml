name: Portal readiness
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
concurrency:
  group: portal-readiness
  cancel-in-progress: false
jobs:
  readiness:
    # Enable after the operator configures the exact URL and subscribes to failed workflow runs.
    if: github.event_name == 'workflow_dispatch' || vars.ONYX_MONITORING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - name: Check database-backed readiness
        env:
          ONYX_HEALTH_URL: ${{ vars.ONYX_HEALTH_URL }}
        run: node scripts/check-readiness.mjs
