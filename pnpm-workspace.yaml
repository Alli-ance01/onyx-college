packages:
  - apps/*
  - packages/*

allowBuilds:
  # Vite's compiler binary requires its official platform-install script.
  esbuild: true

overrides:
  # Vitest exposes jsdom as an optional peer; keep every resolved test peer on the Node 22.19-compatible line.
  jsdom: 29.0.1

catalog:
  '@eslint/js': 10.0.1
  '@hookform/resolvers': 5.9.1
  '@tanstack/react-query': 5.103.2
  '@testing-library/jest-dom': 7.0.1
  '@testing-library/react': 16.3.3
  '@types/cookie-parser': 1.4.10
  '@types/cors': 2.8.19
  '@types/express': 5.0.6
  '@types/node': 22.19.21
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@types/supertest': 7.2.1
  '@vitejs/plugin-react': 6.1.1
  concurrently: 10.0.5
  cookie-parser: 1.4.7
  cors: 2.8.6
  dotenv: 18.0.3
  eslint: 10.11.0
  eslint-config-prettier: 10.1.8
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-react-refresh: 0.5.7
  express: 5.2.1
  globals: 17.12.0
  helmet: 8.3.0
  jsdom: 29.0.1
  mongoose: 9.10.2
  pino: 10.3.1
  pino-http: 11.0.0
  prettier: 3.9.9
  react: 19.3.0
  react-dom: 19.3.0
  react-hook-form: 7.88.0
  react-router: 7.18.4
  supertest: 7.3.0
  tsx: 4.23.15
  typescript: 6.0.3
  typescript-eslint: 8.70.1
  vite: 8.3.1
  vitest: 5.0.1
  zod: 4.6.5

minimumReleaseAgeExclude:
  - vite@8.3.1
