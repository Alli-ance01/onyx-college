services:
  - type: web
    name: onyx-college-api
    runtime: node
    plan: starter
    region: frankfurt
    autoDeployTrigger: checksPass
    buildCommand: corepack enable && corepack prepare pnpm@12.6.0 --activate && pnpm install --frozen-lockfile --prod=false && pnpm --filter @onyx/api... build
    startCommand: pnpm --filter @onyx/api start
    healthCheckPath: /api/v1/health/ready
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: AUTH_ACCESS_TOKEN_SECRET
        generateValue: true
      - key: AUTH_REFRESH_TOKEN_PEPPER
        generateValue: true
      - key: AUTH_ISSUER
        value: onyx-college-api
      - key: AUTH_AUDIENCE
        value: onyx-college-portal
      - key: AUTH_COOKIE_NAME
        value: onyx_refresh
      - key: AUTH_COOKIE_SECURE
        value: 'true'
      - key: AUTH_COOKIE_SAME_SITE
        value: lax
      - key: DOCUMENT_STORAGE_DRIVER
        value: cloudinary
      - key: DOCUMENT_MAX_BYTES
        value: '5242880'
      - key: DOCUMENT_SIGNED_URL_TTL_SECONDS
        value: '120'
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
